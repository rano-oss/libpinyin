name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Check
        run: cargo check -p libpinyin --all-targets && cargo check -p convert_table -p gen_word_bigrams
      - name: Test
        run: cargo test -p libpinyin --all-targets
      - name: Clippy
        run: |
          rustup component add clippy
          cargo clippy -p libpinyin --all-targets -- -D warnings
      - name: Format
        run: |
          rustup component add rustfmt
          cargo fmt --check
